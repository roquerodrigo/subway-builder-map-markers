name: Release

# Runs on every push to main, where it grooms the release PR; merging that PR is
# what cuts the release. workflow_dispatch stays for re-running it by hand.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Release
        id: release
        uses: roquerodrigo/release-autopilot@latest
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}

  publish:
    name: Attach the Railyard assets
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out the released tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The registry rejects a release that ships only the archive: it reads the
      # standalone manifest to check compatibility without downloading the ZIP.
      # `npm run package` builds both and refuses to emit them if the manifest
      # would fail validation.
      - name: Package the release
        run: npm run package

      - name: Upload the assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            dist/release/map-markers-*.zip \
            dist/release/manifest.json
